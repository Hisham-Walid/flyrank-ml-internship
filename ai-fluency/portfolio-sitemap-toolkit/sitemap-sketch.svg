<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hisham's focused ML portfolio sitemap</title>
  <desc id="desc">A four-page portfolio path from Home to Work, About, and Contact, centered on one proof statement and one action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <path d="M62 113 C250 60 439 137 630 88 C822 40 1021 81 1145 43" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 14"/>
  <text x="70" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">One claim. One audience. One action.</text>
  <text x="70" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#334155">Reproducible ML decision support → hiring manager confidence → start a conversation</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="260" height="170" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="100" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">HOME</text>
    <text x="100" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1e3a8a">Proof statement</text>
    <text x="100" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1e3a8a">Verified result preview</text>
    <text x="100" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d4ed8">CTA: View the work</text>

    <rect x="470" y="170" width="330" height="225" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="500" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d">WORK / CASE STUDIES</text>
    <text x="500" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">1. FlyRank flagship case</text>
    <text x="520" y="289" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#166534">method + pipeline + receipts</text>
    <text x="500" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">2. Responsible AI workflow</text>
    <text x="500" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#15803d">Each case → Contact Hisham</text>

    <rect x="870" y="190" width="260" height="170" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="900" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f">CONTACT</text>
    <text x="900" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#78350f">Role · internship</text>
    <text x="900" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#78350f">Project collaboration</text>
    <text x="900" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b45309">One clear invitation</text>

    <rect x="470" y="500" width="330" height="155" rx="22" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="500" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#581c87">ABOUT</text>
    <text x="500" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#581c87">Brief background + principles</text>
    <text x="500" y="615" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#581c87">GitHub + LinkedIn</text>
  </g>

  <path d="M330 275 L465 275" fill="none" stroke="#1e293b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 275 L865 275" fill="none" stroke="#1e293b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M635 400 L635 492" fill="none" stroke="#1e293b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 575 C990 575 1000 430 1000 368" fill="none" stroke="#1e293b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M330 330 C380 520 410 575 462 575" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="70" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Deliberately omitted: standalone Skills, Services, Blog, and Testimonials pages.</text>
</svg>
